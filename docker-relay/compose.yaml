services:
  relay:
    build:
      context: ..
      dockerfile: docker-relay/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "7777:7777/tcp"
    environment:
      COOP_TOKEN: "INSERT_YOUR_TOKEN_HERE"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
